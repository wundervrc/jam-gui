[package]
name = "jam-gui"
version = "0.1.0"
edition = "2021"
description = "Spicetify Jam (P2P listen-together) native GUI for spotifast and cliamp"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.29"
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = "5"
ureq = { version = "2", features = ["json"] }
sysinfo = "0.33"
rand = "0.9"
datachannel = { version = "0.16", features = ["vendored-libdatachannel"] }

[profile.release]
lto = true
strip = true
